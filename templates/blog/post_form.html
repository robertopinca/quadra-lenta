{% extends 'base.html' %}

{% block title %}{{ acao }} &mdash; Quadra Lenta{% endblock %}

{% block conteudo %}

  <h1>{{ acao }}</h1>

  {# A partir da versao 2 das views o formulario vem de um Django form. #}
  <form class="formulario" method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="acoes">
      <button class="botao" type="submit">Salvar</button>
      {% if post %}
        <a class="botao botao-vazio" href="{% url 'post_detail' post.pk %}">Cancelar</a>
      {% else %}
        <a class="botao botao-vazio" href="{% url 'post_list' %}">Cancelar</a>
      {% endif %}
    </div>
  </form>

{% endblock %}
